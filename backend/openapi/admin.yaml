openapi: 3.1.0
info:
  title: economae API (operadores)
  version: 1.1.0
  license:
    name: Proprietária
    identifier: LicenseRef-Proprietaria
  description: |
    **APROVADO pelo responsável em 2026-10-27; congelado.** Área do operador (PRODUTO.md, item 11): aprovar
    alertas, aprovar e bloquear lojas e fontes, revisar denúncias, revisar itens barrados pela triagem de
    medicamento e da NBCAL, cadastrar oferta manual (nunca dispara push) e gravar credenciais de fonte (só escrita).

    ## Convenções
    As de `openapi.yaml` valem aqui (nomes, centavos, datas, tenant, cursor, erro único, limite de taxa,
    idempotência, evolução). Diferenças:
    - Prefixo `/v1/admin`. Esquema de segurança `operador`: token opaco de audiência `operador`. Token do
      app é recusado aqui (401) e token de operador é recusado no app.
    - Operadores têm conta individual e todos têm as mesmas permissões. Só e-mail cadastrado como
      operador do tenant consegue entrar (cadastro de operador: decisão D2).
    - Toda ação que muda estado grava em `/v1/admin/auditoria` quem fez, quando e o quê. Valor de
      credencial nunca entra na auditoria, em log ou em resposta.
    - O operador vê os campos estruturados do alerta; `alerts.motivo` e o score continuam fora da API
      (decisão D16).

    ## 1.1.0 (2026-10-29, só acréscimos; DECISIONS 98)
    Painel web, versão final: `GET /v1/admin/resumo` (tela inicial), loja própria (`POST /v1/admin/lojas`,
    `GET`/`PATCH /v1/admin/lojas/{id}`, `PUT /v1/admin/lojas/{id}/areas`), `GET /v1/admin/operadores` (só leitura;
    cadastro segue por linha de comando, D2), painel financeiro (`/v1/admin/receitas*` e `GET /v1/admin/financeiro`),
    `imagem_url` opcional em `ProdutoNovo`, `propria` e `areas_entrega_total` nos itens de `GET /v1/admin/lojas` e as
    ações de auditoria `loja_criada`, `loja_editada`, `loja_areas_definidas`, `receita_lancada`, `receita_editada` e
    `receitas_importadas` (alvo `receita`). Receita nunca é estimada: só entra lançada ou importada pelo operador.
servers:
  - url: http://127.0.0.1:3000
    description: desenvolvimento
tags:
  - name: auth
    description: Login do operador por código no e-mail.
  - name: operador
    description: Conta do operador.
  - name: alertas
    description: Fila de aprovação e revisão de alertas.
  - name: lojas
    description: Aprovação e bloqueio de lojas.
  - name: fontes
    description: Aprovação e bloqueio de fontes e gravação de credencial.
  - name: denuncias
    description: Ofertas escondidas por denúncia.
  - name: triagem
    description: Itens barrados pela triagem de medicamento e da NBCAL.
  - name: ofertas_manuais
    description: Oferta cadastrada à mão (TIPO E). Nunca dispara push.
  - name: produtos
    description: Busca de produto para a oferta manual.
  - name: auditoria
    description: Registro de toda ação administrativa.
  - name: painel
    description: Resumo da tela inicial do painel (1.1.0).
  - name: financeiro
    description: Receitas lançadas ou importadas pelo operador e métricas medidas pelo sistema (1.1.0).

security:
  - operador: []

paths:
  # ---------------------------------------------------------------- auth
  /v1/admin/auth/email/codigo:
    post:
      tags: [auth]
      operationId: adminSolicitarCodigo
      summary: Envia código de 6 dígitos ao e-mail do operador
      description: |
        202 sempre, inclusive para e-mail que não é operador (nada é enviado nesse caso). Mesmos limites
        do login do app: 1 por e-mail a cada 60 s, 5/h por e-mail, 20/h por IP.
      security: []
      parameters:
        - $ref: './openapi.yaml#/components/parameters/XTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/PedidoCodigoEmail' }
            example: { email: operador@example.com }
      responses:
        '202':
          description: Pedido aceito.
          content:
            application/json:
              schema: { $ref: './openapi.yaml#/components/schemas/CodigoEnviado' }
              example: { expira_em_segundos: 600, reenviar_em_segundos: 60 }
        '400': { $ref: '#/components/responses/R400Tenant' }
        '404': { $ref: '#/components/responses/R404Tenant' }
        '422': { $ref: '#/components/responses/R422' }
        '429': { $ref: '#/components/responses/R429' }
        '503': { $ref: '#/components/responses/R503' }

  /v1/admin/auth/email/verificar:
    post:
      tags: [auth]
      operationId: adminVerificarCodigo
      summary: Troca e-mail e código por uma sessão de operador
      description: Nunca cria conta. E-mail que não é operador sempre recebe `codigo_invalido`. Até 5 tentativas por código.
      security: []
      parameters:
        - $ref: './openapi.yaml#/components/parameters/XTenant'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/VerificacaoCodigoEmail' }
            example: { email: operador@example.com, codigo: '193847' }
      responses:
        '200':
          description: Sessão criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoOperador' }
              examples:
                sessao: { $ref: '#/components/examples/SessaoOperador' }
        '400': { $ref: '#/components/responses/R400Tenant' }
        '404': { $ref: '#/components/responses/R404Tenant' }
        '422':
          description: Código errado, vencido ou corpo inválido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAdmin' }
              examples:
                codigo_invalido: { $ref: '#/components/examples/ErroCodigoInvalido' }
                codigo_expirado: { $ref: '#/components/examples/ErroCodigoExpirado' }
                validacao: { $ref: '#/components/examples/ErroValidacao' }
        '429': { $ref: '#/components/responses/R429' }

  /v1/admin/auth/renovar:
    post:
      tags: [auth]
      operationId: adminRenovarSessao
      summary: Troca o refresh token de operador por um par novo (rotação, uso único)
      description: Mesma regra de reuso do app. Validade do refresh de operador em config (decisão D3).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: './openapi.yaml#/components/schemas/PedidoRenovacao' }
            example: { refresh_token: '<refresh token>' }
      responses:
        '200':
          description: Sessão renovada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessaoOperador' }
              examples:
                sessao: { $ref: '#/components/examples/SessaoOperador' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '429': { $ref: '#/components/responses/R429' }

  /v1/admin/auth/sair:
    post:
      tags: [auth]
      operationId: adminSair
      summary: Revoga a sessão de operador atual
      responses:
        '204': { description: Sessão encerrada. }
        '401': { $ref: '#/components/responses/R401' }

  /v1/admin/me:
    get:
      tags: [operador]
      operationId: adminObterMe
      summary: Dados do operador logado
      responses:
        '200':
          description: Operador.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Operador' }
              examples:
                operador: { $ref: '#/components/examples/Operador' }
        '401': { $ref: '#/components/responses/R401' }

  # ---------------------------------------------------------------- alertas
  /v1/admin/alertas:
    get:
      tags: [alertas]
      operationId: adminListarAlertas
      summary: Alertas para revisão (padrão = aguardando aprovação)
      parameters:
        - name: revisao
          in: query
          schema: { $ref: '#/components/schemas/SituacaoRevisaoAlerta' }
        - name: decisao
          in: query
          schema: { $ref: '#/components/schemas/DecisaoAlerta' }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de alertas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAlertasAdmin' }
              examples:
                pendentes: { $ref: '#/components/examples/PaginaAlertasAdmin' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/alertas/{id}:
    get:
      tags: [alertas]
      operationId: adminObterAlerta
      summary: Detalhe do alerta para o operador
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Alerta.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaAdmin' }
              examples:
                pendente: { $ref: '#/components/examples/AlertaAdmin' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }

  /v1/admin/alertas/{id}/revisao:
    put:
      tags: [alertas]
      operationId: adminRevisarAlerta
      summary: Aprova ou rejeita o alerta (idempotente)
      description: |
        `aprovado` só vale para `aguardar_aprovacao` (senão 409 `estado_conflitante`); depois de aprovado o
        alerta entra no feed e no despacho de push, se a oferta ainda estiver ativa (senão 409
        `oferta_encerrada`). `rejeitado` vale para qualquer decisão, inclusive depois de `aprovado`, e
        tira o alerta do feed (push já enviado não volta). Repetir o mesmo resultado devolve 200 sem mudar
        nada; `aprovado` depois de `rejeitado` dá 409 `ja_revisado` (decisão D17).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoRevisaoAlerta' }
            example: { resultado: aprovado, observacao: Preço conferido no site da loja. }
      responses:
        '200':
          description: Alerta revisado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AlertaAdmin' }
              examples:
                aprovado: { $ref: '#/components/examples/AlertaAdminAprovado' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '409':
          description: Já revisado com outro resultado, oferta encerrada ou decisão que não aceita aprovação.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAdmin' }
              examples:
                ja_revisado: { $ref: '#/components/examples/ErroJaRevisado' }
                oferta_encerrada: { $ref: '#/components/examples/ErroOfertaEncerrada' }
                estado_conflitante: { $ref: '#/components/examples/ErroEstadoConflitante' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- lojas
  /v1/admin/lojas:
    get:
      tags: [lojas]
      operationId: adminListarLojas
      summary: Lojas do tenant
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/StatusConfianca' }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de lojas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaLojasAdmin' }
              examples:
                uma: { $ref: '#/components/examples/PaginaLojasAdmin' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }
    post:
      tags: [lojas]
      operationId: adminCadastrarLojaPropria
      summary: Cadastra uma loja própria (online, sob a fonte `manual`) com as faixas de CEP que ela atende (1.1.0)
      description: Serve à oferta manual. Começa aprovada ou em observação. Nome igual ao de outra loja do tenant dá 422 em `nome`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoLojaPropria' }
            example: { nome: Mercado do Bairro, cnpj: null, status: em_observacao, reputacao: 0.5, areas_entrega: [{ cep_inicio: '14000000', cep_fim: '14999999', prazo_dias: 2 }] }
      responses:
        '201':
          description: Loja criada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LojaAdminDetalhe' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/lojas/{id}/status:
    put:
      tags: [lojas]
      operationId: adminDefinirStatusLoja
      summary: Aprova, põe em observação ou bloqueia a loja (idempotente)
      description: |
        Loja bloqueada: novas ofertas são descartadas pelo motor e os alertas ativos saem do feed. Efeito
        sobre alertas já existentes de loja que passa a aprovada: decisão D18.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoStatusLoja' }
            example: { status: aprovada, observacao: Autorização sanitária conferida. }
      responses:
        '200':
          description: Loja atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LojaAdmin' }
              examples:
                aprovada: { $ref: '#/components/examples/LojaAdmin' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- fontes
  /v1/admin/fontes:
    get:
      tags: [fontes]
      operationId: adminListarFontes
      summary: Fontes do tenant (lista curta, sem paginação)
      responses:
        '200':
          description: Fontes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaFontesAdmin' }
              examples:
                lomadee: { $ref: '#/components/examples/ListaFontesAdmin' }
        '401': { $ref: '#/components/responses/R401' }

  /v1/admin/fontes/{id}/status:
    put:
      tags: [fontes]
      operationId: adminDefinirStatusFonte
      summary: Define confiança e ativação da fonte (idempotente)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoStatusFonte' }
            example: { status_confianca: aprovada, ativa: true, observacao: Termos lidos e registrados em SOURCES.md. }
      responses:
        '200':
          description: Fonte atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FonteAdmin' }
              examples:
                lomadee: { $ref: '#/components/examples/FonteAdmin' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/fontes/{id}/credencial:
    put:
      tags: [fontes]
      operationId: adminGravarCredencialFonte
      summary: Grava ou substitui a credencial da fonte (só escrita)
      description: |
        Cifrada no Postgres (DECISIONS 22, AES-256-GCM). Nunca é devolvida: a leitura da fonte só diz se
        existe credencial, quando e por quem foi gravada. Quais chaves cada fonte exige: a verificar na
        vinculação de cada fonte. Idempotente (substitui por inteiro).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoCredencialFonte' }
            example: { valores: { app_token: '<valor>', source_id: '<valor>' } }
      responses:
        '204': { description: Gravada. }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- denúncias
  /v1/admin/denuncias:
    get:
      tags: [denuncias]
      operationId: adminListarDenuncias
      summary: Ofertas escondidas por denúncia (padrão = aguardando o operador)
      parameters:
        - name: situacao
          in: query
          schema: { $ref: '#/components/schemas/SituacaoCasoDenuncia' }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de casos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaCasosDenuncia' }
              examples:
                um: { $ref: '#/components/examples/PaginaCasosDenuncia' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/denuncias/{id}/resolucao:
    put:
      tags: [denuncias]
      operationId: adminResolverDenuncia
      summary: Restaura a oferta ou mantém escondida (idempotente)
      description: |
        Mesmo resultado repetido devolve 200; resultado diferente do já gravado dá 409 `ja_revisado`.
        O que acontece com denúncias novas depois de restaurar: decisão D19.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoResolucaoDenuncia' }
            example: { resultado: restaurar, observacao: Preço confirmado no site. }
      responses:
        '200':
          description: Caso resolvido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasoDenuncia' }
              examples:
                restaurado: { $ref: '#/components/examples/CasoDenunciaRestaurado' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '409': { $ref: '#/components/responses/R409JaRevisado' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- triagem
  /v1/admin/triagem:
    get:
      tags: [triagem]
      operationId: adminListarTriagem
      summary: Itens barrados pela triagem de medicamento e da NBCAL
      parameters:
        - name: revisado
          in: query
          description: false (padrão) = só os ainda não revisados.
          schema: { type: boolean, default: false }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de bloqueios.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaBloqueiosTriagem' }
              examples:
                um: { $ref: '#/components/examples/PaginaBloqueiosTriagem' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/triagem/{id}/revisao:
    put:
      tags: [triagem]
      operationId: adminRevisarTriagem
      summary: Registra a revisão humana do bloqueio (idempotente)
      description: |
        A triagem continua em falha fechada: `bloqueio_correto` e `falso_positivo` só registram a revisão
        (o falso positivo serve para ajustar as listas). `liberado` registra o falso positivo e deixa o
        item passar a partir da próxima coleta, só quando `BloqueioTriagem.liberavel` é true (cautela da
        NBCAL e filtro de texto de medicamento); em `NBCAL_VEDADO` e medicamento achado por GTIN na CMED
        dá 422 `liberacao_nao_permitida` e só o ajuste das listas muda o resultado (decisão D20). Mesmo
        resultado repetido devolve 200; diferente dá 409 `ja_revisado`.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoRevisaoTriagem' }
            example: { resultado: bloqueio_correto, observacao: Medicamento tarjado. }
      responses:
        '200':
          description: Revisão registrada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BloqueioTriagem' }
              examples:
                revisado: { $ref: '#/components/examples/BloqueioTriagemRevisado' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '409': { $ref: '#/components/responses/R409JaRevisado' }
        '422':
          description: Corpo inválido, ou `liberado` num bloqueio que não pode ser liberado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAdmin' }
              examples:
                validacao: { $ref: '#/components/examples/ErroValidacao' }
                liberacao_nao_permitida: { $ref: '#/components/examples/ErroLiberacaoNaoPermitida' }

  # ---------------------------------------------------------------- ofertas manuais
  /v1/admin/ofertas-manuais:
    get:
      tags: [ofertas_manuais]
      operationId: adminListarOfertasManuais
      summary: Ofertas manuais (TIPO E)
      parameters:
        - name: ativas
          in: query
          description: true (padrão) = só disponíveis e na validade.
          schema: { type: boolean, default: true }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de ofertas manuais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaOfertasManuais' }
              examples:
                uma: { $ref: '#/components/examples/PaginaOfertasManuais' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }
    post:
      tags: [ofertas_manuais]
      operationId: adminCriarOfertaManual
      summary: Cadastra oferta manual (entra no feed como "sem histórico verificado"; nunca dispara push)
      description: |
        Idempotente por `Idempotency-Key`: mesma chave com o mesmo corpo devolve a oferta já criada (201
        de novo); mesma chave com corpo diferente dá 409 `idempotencia_conflito`. Passa pela triagem de
        medicamento (DECISIONS 24) e pela da NBCAL (D30) como qualquer produto; item barrado dá 422
        `bloqueado_pela_triagem` e vai para `/v1/admin/triagem`. Produto existente por `produto_id` ou novo por `produto_novo` (um dos
        dois).

        Entra no feed como `somente_feed` ("sem histórico verificado": a referência é o próprio preço, queda 0) e nunca notifica. Não é
        recoletada: vale até `valida_ate` (ou o prazo padrão do tenant), sem a regra de coleta recente das ofertas coletadas. Fica sob a
        fonte `manual` (tipo E, inativa). Loja de marca da Lomadee é recusada (422 em `loja_id`): o link dela tem de ser o rastreado
        pela plataforma. Sem a lista de medicamentos no servidor (vem da primeira coleta), responde 503: sem triagem, nada entra.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoOfertaManual' }
            examples:
              produto_existente: { $ref: '#/components/examples/PedidoOfertaManual' }
      responses:
        '201':
          description: Oferta criada (ou já criada com esta chave).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OfertaManual' }
              examples:
                criada: { $ref: '#/components/examples/OfertaManual' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '409': { $ref: '#/components/responses/R409Idempotencia' }
        '503':
          description: A lista de medicamentos ainda não está disponível neste servidor. Tente de novo (Retry-After).
          headers:
            Retry-After: { schema: { type: integer } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAdmin' }
              examples:
                servico_indisponivel: { $ref: '#/components/examples/ErroServicoIndisponivel' }
        '422':
          description: Corpo inválido ou produto barrado pela triagem (medicamento ou NBCAL).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErroAdmin' }
              examples:
                validacao: { $ref: '#/components/examples/ErroValidacao' }
                bloqueado_pela_triagem: { $ref: '#/components/examples/ErroBloqueadoPelaTriagem' }

  /v1/admin/ofertas-manuais/{id}:
    delete:
      tags: [ofertas_manuais]
      operationId: adminEncerrarOfertaManual
      summary: Encerra a oferta manual (marca indisponível; idempotente)
      description: A linha fica para auditoria e histórico; o alerta sai do feed.
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204': { description: Encerrada (ou já encerrada). }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }

  # ---------------------------------------------------------------- produtos
  /v1/admin/produtos:
    get:
      tags: [produtos]
      operationId: adminPesquisarProdutos
      summary: Busca produto do tenant por nome, marca ou GTIN (para a oferta manual)
      parameters:
        - name: q
          in: query
          required: true
          schema: { type: string, minLength: 2, maxLength: 100 }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Resultados.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaProdutosAdmin' }
              examples:
                shampoo: { $ref: '#/components/examples/PaginaProdutosAdmin' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- auditoria
  /v1/admin/auditoria:
    get:
      tags: [auditoria]
      operationId: adminListarAuditoria
      summary: Registro de ações administrativas (mais recentes primeiro)
      parameters:
        - name: operador_id
          in: query
          schema: { type: string, format: uuid }
        - name: acao
          in: query
          schema: { $ref: '#/components/schemas/AcaoAuditoria' }
        - name: desde
          in: query
          schema: { type: string, format: date-time }
        - name: ate
          in: query
          schema: { type: string, format: date-time }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de registros.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaAuditoria' }
              examples:
                um: { $ref: '#/components/examples/PaginaAuditoria' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  # ---------------------------------------------------------------- 1.1.0: painel, lojas próprias, operadores, financeiro
  /v1/admin/resumo:
    get:
      tags: [painel]
      operationId: adminObterResumo
      summary: Números da tela inicial (pendências, lojas, coleta, alertas da semana)
      description: '`coleta.dias_historico` fica em cache por 5 minutos. `coleta.ultimo_ciclo` é null quando o servidor não enxerga o arquivo do coletor.'
      responses:
        '200':
          description: Resumo.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoPainel' }
        '401': { $ref: '#/components/responses/R401' }

  /v1/admin/lojas/{id}:
    get:
      tags: [lojas]
      operationId: adminObterLoja
      summary: Detalhe da loja com as faixas de CEP atendidas
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Loja.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LojaAdminDetalhe' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
    patch:
      tags: [lojas]
      operationId: adminEditarLoja
      summary: Corrige nome, rede, CNPJ, autorização sanitária ou reputação (só os campos enviados)
      description: Vale para qualquer loja (inclusive as da coleta). Nome repetido de outra loja dá 422 em `nome`. Repetir os valores atuais devolve 200 sem auditoria nova.
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoEdicaoLoja' }
            example: { nome: Mercado do Bairro (online), reputacao: 0.7, observacao: Nome corrigido. }
      responses:
        '200':
          description: Loja atualizada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LojaAdminDetalhe' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/lojas/{id}/areas:
    put:
      tags: [lojas]
      operationId: adminDefinirAreasLoja
      summary: Substitui as faixas de CEP atendidas pela loja (idempotente)
      description: Lista vazia é aceita (a loja some do feed de todo mundo, porque não entrega em nenhum CEP).
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoAreasLoja' }
            example: { areas_entrega: [{ cep_inicio: '14000000', cep_fim: '14999999', prazo_dias: 2 }], observacao: null }
      responses:
        '200':
          description: Loja com as faixas novas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LojaAdminDetalhe' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/operadores:
    get:
      tags: [operador]
      operationId: adminListarOperadores
      summary: Operadores do tenant (só leitura; cadastro e desativação por linha de comando, D2)
      responses:
        '200':
          description: Operadores, ativos primeiro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListaOperadores' }
        '401': { $ref: '#/components/responses/R401' }

  /v1/admin/receitas:
    get:
      tags: [financeiro]
      operationId: adminListarReceitas
      summary: Lançamentos de receita (mais recentes primeiro, por competência)
      parameters:
        - { name: fonte, in: query, schema: { $ref: '#/components/schemas/FonteReceita' } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/StatusReceita' } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: ate, in: query, schema: { type: string, format: date } }
        - $ref: './openapi.yaml#/components/parameters/Cursor'
        - $ref: './openapi.yaml#/components/parameters/Limite'
      responses:
        '200':
          description: Página de lançamentos.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaReceitas' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }
    post:
      tags: [financeiro]
      operationId: adminLancarReceita
      summary: Lança uma receita
      description: Mesma `fonte` e `referencia` de um lançamento que já existe dá 422 em `referencia`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoReceita' }
            example: { fonte: afiliado_lomadee, competencia: '2026-10-31', valor_centavos: 15890, status: confirmada, descricao: Comissões de outubro, referencia: null }
      responses:
        '201':
          description: Lançada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receita' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/receitas/{id}:
    patch:
      tags: [financeiro]
      operationId: adminEditarReceita
      summary: Corrige ou muda a situação do lançamento (só os campos enviados; cancelar = status cancelada)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoEdicaoReceita' }
            example: { status: recebida }
      responses:
        '200':
          description: Lançamento atualizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receita' }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '404': { $ref: '#/components/responses/R404' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/receitas/importacao:
    post:
      tags: [financeiro]
      operationId: adminImportarReceitas
      summary: Importa até 1000 lançamentos de uma vez (relatório em CSV lido pelo painel)
      description: |
        Valida tudo antes (qualquer linha errada dá 422 com `itens[N].campo` e nada entra; até 50 erros). Linha com `fonte` e
        `referencia` de um lançamento que já existe é pulada e contada em `repetidas`, então importar o mesmo relatório de novo não
        duplica. Linha sem `referencia` sempre entra.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [itens]
              properties:
                itens:
                  type: array
                  minItems: 1
                  maxItems: 1000
                  items: { $ref: '#/components/schemas/PedidoReceita' }
      responses:
        '200':
          description: Resultado da importação.
          content:
            application/json:
              schema:
                type: object
                required: [total, criadas, repetidas]
                properties:
                  total: { type: integer }
                  criadas: { type: integer }
                  repetidas: { type: integer }
        '400': { $ref: '#/components/responses/R400' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

  /v1/admin/financeiro:
    get:
      tags: [financeiro]
      operationId: adminObterFinanceiro
      summary: Receita por mês, fonte e situação; cliques e assinaturas medidos pelo sistema
      description: |
        Meses no fuso do tenant. Lançamento cancelado entra em `por_status.cancelada` mas não soma em `total_centavos` nem em
        `por_fonte`. `cliques` são os toques no botão da oferta nos últimos 30 dias (`alert_events` do tipo `clicado`);
        `cliques_afiliado` são os que levaram a link de afiliado. `receita_afiliado_por_clique_centavos` = receita de afiliado não
        cancelada com competência nos últimos 30 dias ÷ cliques de afiliado no mesmo período (null sem os dois).
      parameters:
        - { name: meses, in: query, schema: { type: integer, minimum: 1, maximum: 36, default: 12 } }
        - { name: ate, in: query, description: 'Último mês (AAAA-MM); padrão = mês atual.', schema: { type: string, pattern: '^\d{4}-\d{2}$' } }
      responses:
        '200':
          description: Resumo financeiro.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResumoFinanceiro' }
        '401': { $ref: '#/components/responses/R401' }
        '422': { $ref: '#/components/responses/R422' }

components:
  securitySchemes:
    operador:
      type: http
      scheme: bearer
      description: Access token opaco de audiência `operador` (campo `access_token` da `SessaoOperador`).

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: UUID gerado pelo cliente para este cadastro.
      schema: { type: string, format: uuid }

  responses:
    R400:
      description: Corpo ilegível.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            requisicao_malformada: { $ref: '#/components/examples/ErroRequisicaoMalformada' }
    R400Tenant:
      description: Corpo ilegível ou `X-Tenant` ausente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            requisicao_malformada: { $ref: '#/components/examples/ErroRequisicaoMalformada' }
            tenant_ausente: { $ref: '#/components/examples/ErroTenantAusente' }
    R401:
      description: Sem token, token vencido, sessão revogada ou token de outra audiência.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            nao_autenticado: { $ref: '#/components/examples/ErroNaoAutenticado' }
            sessao_expirada: { $ref: '#/components/examples/ErroSessaoExpirada' }
            sessao_revogada: { $ref: '#/components/examples/ErroSessaoRevogada' }
    R404:
      description: Inexistente ou de outro tenant.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            nao_encontrado: { $ref: '#/components/examples/ErroNaoEncontrado' }
    R404Tenant:
      description: Tenant desconhecido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            tenant_desconhecido: { $ref: '#/components/examples/ErroTenantDesconhecido' }
    R409JaRevisado:
      description: Já revisado com outro resultado.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            ja_revisado: { $ref: '#/components/examples/ErroJaRevisado' }
    R409Idempotencia:
      description: Mesma chave de idempotência com corpo diferente.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            idempotencia_conflito: { $ref: '#/components/examples/ErroIdempotenciaConflito' }
    R422:
      description: Campo inválido.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            validacao: { $ref: '#/components/examples/ErroValidacao' }
    R429:
      description: Limite de taxa.
      headers:
        Retry-After: { $ref: './openapi.yaml#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            muitas_requisicoes: { $ref: '#/components/examples/ErroMuitasRequisicoes' }
    R503:
      description: Provedor de e-mail indisponível.
      headers:
        Retry-After: { $ref: './openapi.yaml#/components/headers/RetryAfter' }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ErroAdmin' }
          examples:
            servico_indisponivel: { $ref: '#/components/examples/ErroServicoIndisponivel' }

  schemas:
    CodigoErroAdmin:
      type: string
      description: |
        Enum estável. Rotas em que cada código ocorre:
        - `requisicao_malformada` (400): todas com corpo.
        - `tenant_ausente` (400), `tenant_desconhecido` (404): `/v1/admin/auth/email/*`.
        - `nao_autenticado`, `sessao_expirada`, `sessao_revogada` (401): toda rota autenticada e `/v1/admin/auth/renovar`.
        - `nao_encontrado` (404): rotas com id no caminho; `POST /v1/admin/ofertas-manuais` (produto ou loja inexistente).
        - `ja_revisado` (409): `PUT .../alertas/{id}/revisao`, `.../denuncias/{id}/resolucao`, `.../triagem/{id}/revisao`.
        - `oferta_encerrada`, `estado_conflitante` (409): `PUT /v1/admin/alertas/{id}/revisao`.
        - `idempotencia_conflito` (409): `POST /v1/admin/ofertas-manuais`.
        - `validacao` (422): todas com corpo ou parâmetro.
        - `codigo_invalido`, `codigo_expirado` (422): `/v1/admin/auth/email/verificar`.
        - `bloqueado_pela_triagem` (422): `POST /v1/admin/ofertas-manuais`.
        - `liberacao_nao_permitida` (422): `PUT .../triagem/{id}/revisao` com `liberado` em bloqueio não liberável.
        - `muitas_requisicoes` (429): `/v1/admin/auth/*`.
        - `servico_indisponivel` (503): `/v1/admin/auth/email/codigo`.
        - `erro_interno` (500): qualquer rota.
      enum:
        - requisicao_malformada
        - tenant_ausente
        - tenant_desconhecido
        - nao_autenticado
        - sessao_expirada
        - sessao_revogada
        - nao_encontrado
        - ja_revisado
        - oferta_encerrada
        - estado_conflitante
        - idempotencia_conflito
        - validacao
        - codigo_invalido
        - codigo_expirado
        - bloqueado_pela_triagem
        - liberacao_nao_permitida
        - muitas_requisicoes
        - servico_indisponivel
        - erro_interno
    ErroAdmin:
      type: object
      required: [codigo, mensagem]
      properties:
        codigo: { $ref: '#/components/schemas/CodigoErroAdmin' }
        mensagem: { type: string }
        campos:
          type: array
          items: { $ref: './openapi.yaml#/components/schemas/CampoInvalido' }

    # ------------------------------------------------------------ operador
    Operador:
      type: object
      required: [id, email, nome, criado_em]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nome: { type: string }
        criado_em: { type: string, format: date-time }
    OperadorResumo:
      type: object
      required: [id, nome]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
    SessaoOperador:
      type: object
      required: [access_token, access_expira_em, refresh_token, refresh_expira_em, operador]
      properties:
        access_token: { type: string }
        access_expira_em: { type: string, format: date-time }
        refresh_token: { type: string }
        refresh_expira_em: { type: string, format: date-time }
        operador: { $ref: '#/components/schemas/Operador' }
    Revisao:
      type: object
      description: Quem revisou, quando e com que observação.
      required: [operador, em, observacao]
      properties:
        operador: { $ref: '#/components/schemas/OperadorResumo' }
        em: { type: string, format: date-time }
        observacao: { type: [string, 'null'] }

    # ------------------------------------------------------------ tipos comuns
    StatusConfianca:
      type: string
      description: Igual a `stores.status` e `sources.status_confianca`.
      enum: [aprovada, em_observacao, bloqueada]
    Observacao:
      type: [string, 'null']
      maxLength: 1000
      description: Texto livre do operador; vai para a auditoria.
    FonteResumo:
      type: object
      required: [id, nome, tipo, confiabilidade, status_confianca]
      properties:
        id: { type: string, format: uuid }
        nome: { type: string }
        tipo: { type: string, enum: [A, B, C, D, E] }
        confiabilidade: { type: string, enum: [alta, media, baixa] }
        status_confianca: { $ref: '#/components/schemas/StatusConfianca' }
    PaginaBase:
      $ref: './openapi.yaml#/components/schemas/PaginaBase'

    # ------------------------------------------------------------ alertas
    DecisaoAlerta:
      type: string
      description: Igual a `alerts.decisao`.
      enum: [notificar, aguardar_aprovacao, somente_feed]
    SituacaoRevisaoAlerta:
      type: string
      description: '`nao_exigida` = decisão que não passa por aprovação e nunca foi rejeitada.'
      enum: [pendente, aprovado, rejeitado, nao_exigida]
    AlertaAdmin:
      type: object
      required:
        - id
        - criado_em
        - decisao
        - revisao
        - revisao_por
        - situacao_oferta
        - produto
        - loja
        - fonte
        - preco_centavos
        - preco_referencia_centavos
        - preco_por_unidade_centavos
        - preco_referencia_por_unidade_centavos
        - queda
        - rotulo_condicao
        - entrega_a_confirmar
        - valida_ate
        - coletada_em
        - link
        - link_afiliado
      properties:
        id: { type: string, format: uuid }
        criado_em: { type: string, format: date-time }
        decisao: { $ref: '#/components/schemas/DecisaoAlerta' }
        revisao: { $ref: '#/components/schemas/SituacaoRevisaoAlerta' }
        revisao_por:
          oneOf:
            - $ref: '#/components/schemas/Revisao'
            - type: 'null'
        situacao_oferta:
          type: string
          enum: [ativa, encerrada, escondida_por_denuncia]
        produto: { $ref: './openapi.yaml#/components/schemas/ProdutoResumo' }
        loja: { $ref: '#/components/schemas/LojaAdmin' }
        fonte: { $ref: '#/components/schemas/FonteResumo' }
        preco_centavos: { type: integer, minimum: 1 }
        preco_referencia_centavos: { type: integer, minimum: 1 }
        preco_por_unidade_centavos: { type: number }
        preco_referencia_por_unidade_centavos: { type: number }
        queda: { type: number, minimum: 0, maximum: 1 }
        rotulo_condicao: { type: [string, 'null'] }
        entrega_a_confirmar: { type: boolean }
        valida_ate: { type: [string, 'null'], format: date-time }
        coletada_em: { type: string, format: date-time }
        link: { type: string, format: uri }
        link_afiliado: { type: boolean }
    PaginaAlertasAdmin:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/AlertaAdmin' }
    PedidoRevisaoAlerta:
      type: object
      required: [resultado]
      properties:
        resultado: { type: string, enum: [aprovado, rejeitado] }
        observacao: { $ref: '#/components/schemas/Observacao' }

    # ------------------------------------------------------------ lojas
    LojaAdmin:
      type: object
      required: [id, rede, nome, cnpj, tipo, status, reputacao, autorizacao_sanitaria, criado_em]
      properties:
        id: { type: string, format: uuid }
        rede: { type: string }
        nome: { type: string }
        cnpj: { type: [string, 'null'], pattern: '^[0-9]{14}$' }
        tipo: { type: string, enum: [online, fisica] }
        status: { $ref: '#/components/schemas/StatusConfianca' }
        reputacao: { type: number, minimum: 0, maximum: 1 }
        autorizacao_sanitaria: { type: [string, 'null'] }
        criado_em: { type: string, format: date-time }
    PaginaLojasAdmin:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/LojaAdminItem' }
    PedidoStatusLoja:
      type: object
      required: [status]
      properties:
        status: { $ref: '#/components/schemas/StatusConfianca' }
        observacao: { $ref: '#/components/schemas/Observacao' }

    # ------------------------------------------------------------ fontes
    EstadoCredencial:
      type: object
      required: [definida, atualizada_em, atualizada_por]
      properties:
        definida: { type: boolean }
        atualizada_em: { type: [string, 'null'], format: date-time }
        atualizada_por:
          oneOf:
            - $ref: '#/components/schemas/OperadorResumo'
            - type: 'null'
    FonteAdmin:
      allOf:
        - $ref: '#/components/schemas/FonteResumo'
        - type: object
          required: [frequencia_minutos, regiao, ativa, credencial]
          properties:
            frequencia_minutos: { type: integer, minimum: 1 }
            regiao: { type: string }
            ativa: { type: boolean }
            credencial: { $ref: '#/components/schemas/EstadoCredencial' }
    ListaFontesAdmin:
      type: object
      required: [itens]
      properties:
        itens:
          type: array
          items: { $ref: '#/components/schemas/FonteAdmin' }
    PedidoStatusFonte:
      type: object
      required: [status_confianca, ativa]
      properties:
        status_confianca: { $ref: '#/components/schemas/StatusConfianca' }
        ativa: { type: boolean }
        observacao: { $ref: '#/components/schemas/Observacao' }
    PedidoCredencialFonte:
      type: object
      required: [valores]
      properties:
        valores:
          type: object
          writeOnly: true
          minProperties: 1
          maxProperties: 20
          description: Pares nome → valor exigidos pela fonte. Nunca devolvidos.
          additionalProperties: { type: string, maxLength: 4096 }

    # ------------------------------------------------------------ denúncias
    SituacaoCasoDenuncia:
      type: string
      description: '`escondida` = aguardando o operador; `restaurada` e `mantida_escondida` = resolvidos.'
      enum: [escondida, restaurada, mantida_escondida]
    CasoDenuncia:
      type: object
      required: [id, aberto_em, situacao, oferta, denuncias, pessoas_base, limite, motivos, resolucao, resolucao_por]
      properties:
        id: { type: string, format: uuid }
        aberto_em: { type: string, format: date-time, description: Quando o limite foi passado e a oferta sumiu. }
        situacao: { $ref: '#/components/schemas/SituacaoCasoDenuncia' }
        oferta: { $ref: '#/components/schemas/OfertaResumoAdmin' }
        denuncias: { type: integer, minimum: 0, description: Pessoas distintas que denunciaram no preço atual. }
        pessoas_base: { type: integer, minimum: 0, description: Pessoas distintas que abriram ou clicaram em 7 dias. }
        limite: { type: integer, minimum: 1, description: Limite calculado no momento em que a oferta sumiu. }
        motivos:
          type: object
          required: [preco_errado, sem_estoque]
          properties:
            preco_errado: { type: integer, minimum: 0 }
            sem_estoque: { type: integer, minimum: 0 }
        resolucao: { type: [string, 'null'], enum: [restaurar, manter_escondida, null] }
        resolucao_por:
          oneOf:
            - $ref: '#/components/schemas/Revisao'
            - type: 'null'
    OfertaResumoAdmin:
      type: object
      required: [id, produto, loja, preco_centavos, link, coletada_em]
      properties:
        id: { type: string, format: uuid }
        produto: { $ref: './openapi.yaml#/components/schemas/ProdutoResumo' }
        loja: { $ref: './openapi.yaml#/components/schemas/LojaResumo' }
        preco_centavos: { type: integer, minimum: 1 }
        link: { type: string, format: uri }
        coletada_em: { type: string, format: date-time }
    PaginaCasosDenuncia:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/CasoDenuncia' }
    PedidoResolucaoDenuncia:
      type: object
      required: [resultado]
      properties:
        resultado: { type: string, enum: [restaurar, manter_escondida] }
        observacao: { $ref: '#/components/schemas/Observacao' }

    # ------------------------------------------------------------ triagem
    BloqueioTriagem:
      type: object
      description: Igual a `triagem_bloqueios`, mais a revisão.
      required: [id, fonte, id_externo, titulo, codigo, detalhe, revisao_humana, liberavel, primeira_vez_em, ultima_vez_em, resultado, revisao_por]
      properties:
        id: { type: string, format: uuid }
        fonte: { $ref: '#/components/schemas/FonteResumo' }
        id_externo: { type: string }
        titulo: { type: string }
        codigo: { type: string, description: Código da triagem que barrou o item. }
        detalhe: { type: string }
        revisao_humana: { type: boolean, description: true quando a triagem pediu revisão humana. }
        liberavel: { type: boolean, description: 'true só para cautela da NBCAL e filtro de texto de medicamento; false em NBCAL_VEDADO e medicamento por GTIN na CMED (decisão D20).' }
        primeira_vez_em: { type: string, format: date-time }
        ultima_vez_em: { type: string, format: date-time }
        resultado: { type: [string, 'null'], enum: [bloqueio_correto, falso_positivo, liberado, null] }
        revisao_por:
          oneOf:
            - $ref: '#/components/schemas/Revisao'
            - type: 'null'
    PaginaBloqueiosTriagem:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/BloqueioTriagem' }
    PedidoRevisaoTriagem:
      type: object
      required: [resultado]
      properties:
        resultado: { type: string, enum: [bloqueio_correto, falso_positivo, liberado] }
        observacao: { $ref: '#/components/schemas/Observacao' }

    # ------------------------------------------------------------ ofertas manuais
    Condicao:
      description: Igual a `Condicao` do motor (`backend/src/curadoria/tipos.ts`) e a `offers.condicao`.
      oneOf:
        - $ref: '#/components/schemas/CondicaoLevePague'
        - $ref: '#/components/schemas/CondicaoCartaoFidelidade'
        - $ref: '#/components/schemas/CondicaoAppDaRede'
        - $ref: '#/components/schemas/CondicaoQuantidadeMinima'
      discriminator:
        propertyName: tipo
        mapping:
          leve_pague: '#/components/schemas/CondicaoLevePague'
          cartao_fidelidade: '#/components/schemas/CondicaoCartaoFidelidade'
          app_da_rede: '#/components/schemas/CondicaoAppDaRede'
          quantidade_minima: '#/components/schemas/CondicaoQuantidadeMinima'
    CondicaoLevePague:
      type: object
      required: [tipo, leve, pague]
      properties:
        tipo: { type: string, const: leve_pague }
        leve: { type: integer, minimum: 2 }
        pague: { type: integer, minimum: 1 }
    CondicaoCartaoFidelidade:
      type: object
      required: [tipo, programa]
      properties:
        tipo: { type: string, const: cartao_fidelidade }
        programa: { type: string, maxLength: 100 }
    CondicaoAppDaRede:
      type: object
      required: [tipo]
      properties:
        tipo: { type: string, const: app_da_rede }
    CondicaoQuantidadeMinima:
      type: object
      required: [tipo, quantidade]
      properties:
        tipo: { type: string, const: quantidade_minima }
        quantidade: { type: integer, minimum: 2 }
    ProdutoNovo:
      type: object
      required: [nome, categoria, embalagem]
      properties:
        nome: { type: string, maxLength: 300 }
        marca: { type: [string, 'null'], maxLength: 100 }
        categoria: { $ref: './openapi.yaml#/components/schemas/Slug' }
        subcategoria:
          type: [string, 'null']
          description: Opcional. Uma das subcategorias da categoria em `/v1/configuracao`.
        gtin: { type: [string, 'null'], pattern: '^[0-9]{8,14}$' }
        embalagem: { $ref: './openapi.yaml#/components/schemas/Embalagem' }
        imagem_url: { type: [string, 'null'], format: uri, maxLength: 2048, description: 'Opcional (1.1.0). Foto do produto (https). Produto que já existe mantém a foto que tinha.' }
    PedidoOfertaManual:
      type: object
      required: [loja_id, preco_centavos, condicao, frete, valida_de, link, link_afiliado]
      oneOf:
        - required: [produto_id]
        - required: [produto_novo]
      properties:
        produto_id: { type: string, format: uuid }
        produto_novo: { $ref: '#/components/schemas/ProdutoNovo' }
        loja_id: { type: string, format: uuid }
        preco_centavos: { type: integer, minimum: 1, description: Preço de uma embalagem sob a condição. }
        condicao:
          oneOf:
            - $ref: '#/components/schemas/Condicao'
            - type: 'null'
        frete: { $ref: './openapi.yaml#/components/schemas/Frete' }
        valida_de: { type: [string, 'null'], format: date-time }
        valida_ate:
          type: [string, 'null']
          format: date-time
          description: 'Opcional (decisão D21). Ausente ou null = o servidor aplica o prazo padrão do tenant (config) e devolve `validade_padrao_aplicada` = true.'
        link: { type: string, format: uri, maxLength: 2048 }
        link_afiliado: { type: boolean }
    OfertaManual:
      type: object
      required: [id, produto, loja, preco_centavos, condicao, rotulo_condicao, frete, valida_de, valida_ate, validade_padrao_aplicada, link, link_afiliado, disponivel, alerta_id, criada_por, criada_em]
      properties:
        id: { type: string, format: uuid }
        produto: { $ref: './openapi.yaml#/components/schemas/ProdutoResumo' }
        loja: { $ref: './openapi.yaml#/components/schemas/LojaResumo' }
        preco_centavos: { type: integer, minimum: 1 }
        condicao:
          oneOf:
            - $ref: '#/components/schemas/Condicao'
            - type: 'null'
        rotulo_condicao: { type: [string, 'null'], description: Rótulo gerado pelo motor a partir da condição. }
        frete: { $ref: './openapi.yaml#/components/schemas/Frete' }
        valida_de: { type: [string, 'null'], format: date-time }
        valida_ate: { type: [string, 'null'], format: date-time, description: Sempre preenchida na resposta (prazo padrão quando o pedido veio sem data). }
        validade_padrao_aplicada: { type: boolean, description: "true quando o pedido veio sem `valida_ate`; o painel avisa que não há data de fim informada (decisão D21)." }
        link: { type: string, format: uri }
        link_afiliado: { type: boolean }
        disponivel: { type: boolean }
        alerta_id: { type: [string, 'null'], format: uuid, description: Alerta `somente_feed` criado para a oferta. }
        criada_por: { $ref: '#/components/schemas/OperadorResumo' }
        criada_em: { type: string, format: date-time }
    PaginaOfertasManuais:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/OfertaManual' }
    PaginaProdutosAdmin:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: './openapi.yaml#/components/schemas/ProdutoResumo' }

    # ------------------------------------------------------------ auditoria
    AcaoAuditoria:
      type: string
      enum:
        - operador_entrou
        - alerta_revisado
        - loja_status_definido
        - fonte_status_definido
        - fonte_credencial_gravada
        - denuncia_resolvida
        - triagem_revisada
        - triagem_liberada
        - oferta_manual_criada
        - oferta_manual_encerrada
        - loja_criada
        - loja_editada
        - loja_areas_definidas
        - receita_lancada
        - receita_editada
        - receitas_importadas
    RegistroAuditoria:
      type: object
      required: [id, em, operador, acao, alvo_tipo, alvo_id, detalhe]
      properties:
        id: { type: string, format: uuid }
        em: { type: string, format: date-time }
        operador: { $ref: '#/components/schemas/OperadorResumo' }
        acao: { $ref: '#/components/schemas/AcaoAuditoria' }
        alvo_tipo: { type: string, enum: [operador, alerta, loja, fonte, caso_denuncia, triagem, oferta, receita] }
        alvo_id: { type: string, format: uuid }
        detalhe:
          type: object
          description: Antes e depois dos campos alterados e a observação. Nunca contém valor de credencial.
    PaginaAuditoria:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens:
              type: array
              items: { $ref: '#/components/schemas/RegistroAuditoria' }

    # ------------------------------------------------------------ 1.1.0
    LojaAdminItem:
      allOf:
        - $ref: '#/components/schemas/LojaAdmin'
        - type: object
          required: [propria, areas_entrega_total]
          properties:
            propria: { type: boolean, description: Loja cadastrada pelo operador (fonte `manual`). }
            areas_entrega_total: { type: integer, minimum: 0, description: Faixas de CEP atendidas; 0 = não aparece no feed de ninguém. }
    AreaEntrega:
      type: object
      required: [cep_inicio, cep_fim, prazo_dias]
      properties:
        cep_inicio: { type: string, pattern: '^[0-9]{8}$' }
        cep_fim: { type: string, pattern: '^[0-9]{8}$' }
        prazo_dias: { type: integer, minimum: 0, maximum: 90 }
    LojaAdminDetalhe:
      allOf:
        - $ref: '#/components/schemas/LojaAdmin'
        - type: object
          required: [propria, fontes, aceita_oferta_manual, areas_entrega, ofertas_disponiveis]
          properties:
            propria: { type: boolean }
            fontes: { type: array, items: { type: string }, description: Nomes das fontes ligadas à loja. }
            aceita_oferta_manual: { type: boolean, description: false em loja de marca com trava de link (Lomadee, D67). }
            areas_entrega: { type: array, items: { $ref: '#/components/schemas/AreaEntrega' } }
            ofertas_disponiveis: { type: integer, minimum: 0 }
    PedidoLojaPropria:
      type: object
      required: [nome, areas_entrega]
      properties:
        nome: { type: string, maxLength: 120 }
        rede: { type: [string, 'null'], maxLength: 120, description: Ausente ou null = o nome. }
        cnpj: { type: [string, 'null'], description: 14 dígitos (pontos, barra e traço são ignorados). }
        autorizacao_sanitaria: { type: [string, 'null'], maxLength: 120 }
        status: { type: string, enum: [aprovada, em_observacao], default: em_observacao }
        reputacao: { type: number, minimum: 0, maximum: 1, default: 0.5 }
        areas_entrega: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/AreaEntrega' } }
    PedidoEdicaoLoja:
      type: object
      minProperties: 1
      properties:
        nome: { type: string, maxLength: 120 }
        rede: { type: string, maxLength: 120 }
        cnpj: { type: [string, 'null'] }
        autorizacao_sanitaria: { type: [string, 'null'], maxLength: 120 }
        reputacao: { type: number, minimum: 0, maximum: 1 }
        observacao: { $ref: '#/components/schemas/Observacao' }
    PedidoAreasLoja:
      type: object
      required: [areas_entrega]
      properties:
        areas_entrega: { type: array, maxItems: 100, items: { $ref: '#/components/schemas/AreaEntrega' } }
        observacao: { $ref: '#/components/schemas/Observacao' }
    OperadorGestao:
      type: object
      required: [id, email, nome, ativo, criado_em, ultimo_acesso_em, voce]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nome: { type: string }
        ativo: { type: boolean }
        criado_em: { type: string, format: date-time }
        ultimo_acesso_em: { type: [string, 'null'], format: date-time, description: Último login ou renovação de sessão. }
        voce: { type: boolean, description: true para o operador logado. }
    ListaOperadores:
      type: object
      required: [itens]
      properties:
        itens: { type: array, items: { $ref: '#/components/schemas/OperadorGestao' } }
    ResumoPainel:
      type: object
      required: [gerado_em, pendencias, ofertas_manuais_ativas, lojas, fontes, catalogo, coleta, alertas_7_dias]
      properties:
        gerado_em: { type: string, format: date-time }
        pendencias:
          type: object
          required: [alertas, triagem, denuncias]
          properties:
            alertas: { type: integer, description: Alertas aguardando aprovação. }
            triagem: { type: integer, description: Bloqueios ainda não revisados. }
            denuncias: { type: integer, description: Ofertas escondidas aguardando decisão. }
        ofertas_manuais_ativas: { type: integer }
        lojas:
          type: object
          required: [aprovada, em_observacao, bloqueada, sem_area_entrega]
          properties:
            aprovada: { type: integer }
            em_observacao: { type: integer }
            bloqueada: { type: integer }
            sem_area_entrega: { type: integer, description: Lojas não bloqueadas sem nenhuma faixa de CEP. }
        fontes:
          type: object
          required: [ativas, total]
          properties: { ativas: { type: integer }, total: { type: integer } }
        catalogo:
          type: object
          required: [produtos, ofertas_disponiveis]
          properties: { produtos: { type: integer }, ofertas_disponiveis: { type: integer } }
        coleta:
          type: object
          required: [ultima_coleta_em, dias_historico, dias_para_alertas, ultimo_ciclo]
          properties:
            ultima_coleta_em: { type: [string, 'null'], format: date-time, description: Oferta coletada mais recente (não conta a manual). }
            dias_historico: { type: integer, description: Dias já fechados com preço guardado. }
            dias_para_alertas: { type: integer, description: Dias de histórico que o motor exige. }
            ultimo_ciclo:
              oneOf:
                - type: object
                  required: [fim, falhou, erro]
                  properties:
                    fim: { type: string, format: date-time }
                    falhou: { type: boolean }
                    erro: { type: [string, 'null'] }
                - type: 'null'
        alertas_7_dias:
          type: object
          required: [criados, aprovados, rejeitados, notificados]
          description: Alertas do motor (ofertas coletadas) criados nos últimos 7 dias.
          properties:
            criados: { type: integer }
            aprovados: { type: integer }
            rejeitados: { type: integer }
            notificados: { type: integer }
    FonteReceita:
      type: string
      enum: [afiliado_lomadee, afiliado_outros, assinatura_google_play, assinatura_app_store, anuncios, outros]
    StatusReceita:
      type: string
      description: '`prevista` = comissão pendente na rede; `confirmada` = aprovada, a receber; `recebida` = paga; `cancelada` = não conta.'
      enum: [prevista, confirmada, recebida, cancelada]
    PedidoReceita:
      type: object
      required: [fonte, competencia, valor_centavos, status]
      properties:
        fonte: { $ref: '#/components/schemas/FonteReceita' }
        competencia: { type: string, format: date, description: Dia da venda ou do mês a que a receita se refere. }
        valor_centavos: { type: integer, minimum: 1, maximum: 1000000000 }
        status: { $ref: '#/components/schemas/StatusReceita' }
        descricao: { type: [string, 'null'], maxLength: 300 }
        referencia: { type: [string, 'null'], maxLength: 120, description: Id no relatório de origem; único por fonte. }
    PedidoEdicaoReceita:
      type: object
      minProperties: 1
      properties:
        fonte: { $ref: '#/components/schemas/FonteReceita' }
        competencia: { type: string, format: date }
        valor_centavos: { type: integer, minimum: 1, maximum: 1000000000 }
        status: { $ref: '#/components/schemas/StatusReceita' }
        descricao: { type: [string, 'null'], maxLength: 300 }
        referencia: { type: [string, 'null'], maxLength: 120 }
    Receita:
      type: object
      required: [id, fonte, competencia, valor_centavos, status, descricao, referencia, criada_por, criada_em, atualizada_por, atualizada_em]
      properties:
        id: { type: string, format: uuid }
        fonte: { $ref: '#/components/schemas/FonteReceita' }
        competencia: { type: string, format: date }
        valor_centavos: { type: integer }
        status: { $ref: '#/components/schemas/StatusReceita' }
        descricao: { type: [string, 'null'] }
        referencia: { type: [string, 'null'] }
        criada_por: { $ref: '#/components/schemas/OperadorResumo' }
        criada_em: { type: string, format: date-time }
        atualizada_por:
          oneOf:
            - $ref: '#/components/schemas/OperadorResumo'
            - type: 'null'
        atualizada_em: { type: [string, 'null'], format: date-time }
    PaginaReceitas:
      allOf:
        - $ref: '#/components/schemas/PaginaBase'
        - type: object
          required: [itens]
          properties:
            itens: { type: array, items: { $ref: '#/components/schemas/Receita' } }
    ValoresPorFonte:
      type: object
      description: Centavos por `FonteReceita` (todas as chaves sempre presentes).
      additionalProperties: { type: integer }
    ValoresPorStatus:
      type: object
      description: Centavos por `StatusReceita` (todas as chaves sempre presentes).
      additionalProperties: { type: integer }
    ReceitaDoPeriodo:
      type: object
      required: [total_centavos, por_fonte, por_status, lancamentos]
      properties:
        total_centavos: { type: integer, description: Sem as canceladas. }
        por_fonte: { $ref: '#/components/schemas/ValoresPorFonte' }
        por_status: { $ref: '#/components/schemas/ValoresPorStatus' }
        lancamentos: { type: integer }
    ResumoFinanceiro:
      type: object
      required: [gerado_em, periodo, meses, totais, mes_atual, cliques, assinaturas, receita_afiliado_por_clique_centavos]
      properties:
        gerado_em: { type: string, format: date-time }
        periodo:
          type: object
          required: [de, ate]
          properties: { de: { type: string }, ate: { type: string } }
        meses:
          type: array
          description: Do mais antigo ao mais novo; mês sem lançamento vem zerado.
          items:
            allOf:
              - $ref: '#/components/schemas/ReceitaDoPeriodo'
              - type: object
                required: [mes]
                properties: { mes: { type: string, pattern: '^\d{4}-\d{2}$' } }
        totais: { $ref: '#/components/schemas/ReceitaDoPeriodo' }
        mes_atual:
          type: object
          required: [mes, total_centavos, recebido_centavos, a_receber_centavos, variacao]
          properties:
            mes: { type: string }
            total_centavos: { type: integer }
            recebido_centavos: { type: integer }
            a_receber_centavos: { type: integer, description: Prevista + confirmada. }
            variacao: { type: [number, 'null'], description: Fração sobre o mês anterior (0.2 = +20%); null se o anterior foi zero. }
        cliques:
          type: object
          required: [dias, total, afiliado]
          properties:
            dias:
              type: array
              items:
                type: object
                required: [dia, cliques, cliques_afiliado]
                properties: { dia: { type: string, format: date }, cliques: { type: integer }, cliques_afiliado: { type: integer } }
            total: { type: integer }
            afiliado: { type: integer }
        assinaturas:
          type: object
          required: [ativas, por_plano]
          properties:
            ativas: { type: integer }
            por_plano: { type: object, additionalProperties: { type: integer } }
        receita_afiliado_por_clique_centavos: { type: [integer, 'null'] }

