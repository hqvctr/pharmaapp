# Ambiente de desenvolvimento. Credenciais vêm do .env (copie de .env.example).
services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7.4.1-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build: ./backend
    command: ["node", "dist/db/migrate.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    command: ["node", "dist/api/server.js"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      API_PORT: "3000"
      # Login por e-mail (docs/operacao/login-por-email.md). Sem AUTH_HMAC_KEY e um provedor, as rotas de login ficam desligadas.
      AUTH_HMAC_KEY: ${AUTH_HMAC_KEY:-}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      EMAIL_REMETENTE: ${EMAIL_REMETENTE:-}
      EMAIL_REMETENTE_NOME: ${EMAIL_REMETENTE_NOME:-economae}
      AUTH_EMAIL_CONSOLE: ${AUTH_EMAIL_CONSOLE:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Link rastreado da Lomadee no detalhe do alerta: a credencial cifrada no banco (mesma chave do coletor) ou o proxy da nuvem.
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      CREDENTIALS_KEY_VERSION: ${CREDENTIALS_KEY_VERSION:-v1}
      LOMADEE_PELO_PROXY: ${LOMADEE_PELO_PROXY:-}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Coleta de preços (perfil "coleta": COMPOSE_PROFILES=coleta no .env). Veja docs/operacao/instalar-no-seu-computador.md.
  provisionar:
    profiles: ["coleta"]
    build: ./backend
    command: ["node", "dist/pipeline/provisionar.js", "--tenant", "${TENANT:-padrao}"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      migrate:
        condition: service_completed_successfully

  coletor:
    profiles: ["coleta"]
    build: ./backend
    command: ["node", "dist/pipeline/ciclo.js"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      CREDENTIALS_KEY_VERSION: ${CREDENTIALS_KEY_VERSION:-v1}
      TENANT: ${TENANT:-padrao}
      INTERVALO_COLETA_MIN: ${INTERVALO_COLETA_MIN:-120}
      NODE_OPTIONS: --max-old-space-size=2048
    volumes:
      - dados:/app/data
    depends_on:
      provisionar:
        condition: service_completed_successfully
    healthcheck:
      # Saudável se o último ciclo terminou há menos de 6 horas.
      test: ["CMD", "node", "-e", "process.exit(Date.now()-require('fs').statSync('/app/data/ultimo-ciclo.json').mtimeMs<6*3600e3?0:1)"]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 40m

volumes:
  pgdata:
  dados:
